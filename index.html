<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Случайный звонок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e4ff;--ink:#1b1340;--pink:#ff5c8a;--sun:#ffd84d;--card:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
main{max-width:420px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:24px 0}
h1{font-size:34px;font-weight:800;line-height:1.05;margin:0}
h2{font-size:15px;font-weight:600;margin:0 0 8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:14px 8px;border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);font:600 16px Rubik,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.go{width:100%;padding:18px;border:0;border-radius:18px;background:var(--pink);color:#fff;font:800 20px Rubik,sans-serif;cursor:pointer}
.go:disabled{opacity:.4}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#call{display:none;text-align:center}
.orb{width:190px;height:190px;margin:10px auto 20px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);display:grid;place-items:center;font-size:44px;font-weight:800}
.orb.wait{animation:p 1.6s ease-in-out infinite}
.orb.live{background:var(--pink);color:#fff;animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none!important}}
#status{font-size:18px;font-weight:600;min-height:28px;margin-bottom:18px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row button{flex:1;padding:14px 6px;border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);font:600 15px Rubik,sans-serif;cursor:pointer}
.row .next{background:var(--ink);color:#fff}
#err{color:#b00020;font-weight:600;min-height:20px}
</style>
</head>
<body>
<main>
  <section id="setup">
    <h1>Случайный<br>голосовой звонок</h1>
    <div style="height:20px"></div>
    <h2>Я</h2>
    <div class="seg" id="me">
      <button data-v="m" aria-pressed="false">Парень</button>
      <button data-v="f" aria-pressed="false">Девушка</button>
    </div>
    <div style="height:16px"></div>
    <h2>Ищу</h2>
    <div class="seg" id="want">
      <button data-v="f" aria-pressed="false">Девушку</button>
      <button data-v="m" aria-pressed="false">Парня</button>
      <button data-v="any" aria-pressed="false">Любого</button>
    </div>
    <div style="height:20px"></div>
    <button class="go" id="find" disabled>Найти собеседника</button>
    <p id="err"></p>
  </section>

  <section id="call">
    <div class="orb wait" id="orb">…</div>
    <div id="status"></div>
    <div class="row">
      <button id="mute">Выключить микрофон</button>
      <button id="report">Пожаловаться</button>
    </div>
    <div class="row">
      <button class="next" id="next">Следующий</button>
      <button id="stop">Закончить</button>
    </div>
  </section>
  <audio id="remote" autoplay playsinline></audio>
</main>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = (id) => document.getElementById(id);
const state = { gender: null, looking: null };
let ws, pc, local, cfg, pendingIce = [], muted = false;
let guest = null;
try { guest = localStorage.getItem('guest') || (crypto.randomUUID()); localStorage.setItem('guest', guest);
  state.gender = localStorage.getItem('g'); state.looking = localStorage.getItem('l'); } catch (e) { guest = guest || String(Math.random()); }

function pick(groupId, key) {
  const g = $(groupId);
  g.querySelectorAll('button').forEach((b) => {
    b.setAttribute('aria-pressed', b.dataset.v === state[key]);
    b.onclick = () => {
      state[key] = b.dataset.v;
      try { localStorage.setItem(key === 'gender' ? 'g' : 'l', state[key]); } catch (e) {}
      pick(groupId, key);
      $('find').disabled = !(state.gender && state.looking);
    };
  });
}
pick('me', 'gender'); pick('want', 'looking');
$('find').disabled = !(state.gender && state.looking);

function show(inCall) { $('setup').style.display = inCall ? 'none' : ''; $('call').style.display = inCall ? 'block' : 'none'; }
function setStatus(text, live) { $('status').textContent = text; $('orb').className = 'orb ' + (live ? 'live' : 'wait'); $('orb').textContent = live ? '🎧' : '…'; }
const sendWs = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

function closePc() {
  if (pc) { pc.onicecandidate = pc.ontrack = pc.onconnectionstatechange = null; pc.close(); pc = null; }
  pendingIce = []; $('remote').srcObject = null;
}

function find() {
  closePc(); setStatus('Ищем собеседника…', false);
  sendWs({ t: 'find', gender: state.gender, looking: state.looking, initData: tg ? tg.initData : '', guest });
}

async function newPc(initiator) {
  closePc();
  pc = new RTCPeerConnection(cfg);
  local.getTracks().forEach((t) => pc.addTrack(t, local));
  pc.ontrack = (e) => { $('remote').srcObject = e.streams[0]; };
  pc.onicecandidate = (e) => e.candidate && sendWs({ t: 'signal', data: { ice: e.candidate } });
  pc.onconnectionstatechange = () => {
    if (!pc) return;
    if (pc.connectionState === 'connected') setStatus('Вы на связи', true);
    if (pc.connectionState === 'failed') { setStatus('Не удалось соединиться', false); find(); }
  };
  if (initiator) {
    await pc.setLocalDescription(await pc.createOffer());
    sendWs({ t: 'signal', data: { sdp: pc.localDescription } });
  }
}

async function onSignal(d) {
  if (!pc) return;
  if (d.sdp) {
    await pc.setRemoteDescription(d.sdp);
    for (const c of pendingIce) await pc.addIceCandidate(c);
    pendingIce = [];
    if (d.sdp.type === 'offer') {
      await pc.setLocalDescription(await pc.createAnswer());
      sendWs({ t: 'signal', data: { sdp: pc.localDescription } });
    }
  } else if (d.ice) {
    if (pc.remoteDescription) await pc.addIceCandidate(d.ice); else pendingIce.push(d.ice);
  }
}

function connect() {
  return new Promise((res) => {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    ws.onopen = res;
    ws.onmessage = async (e) => {
      const m = JSON.parse(e.data);
      if (m.t === 'wait') setStatus('Ищем собеседника… Онлайн: ' + m.online, false);
      if (m.t === 'match') { setStatus('Соединяем…', false); await newPc(m.initiator); }
      if (m.t === 'signal') await onSignal(m.data);
      if (m.t === 'left') { setStatus('Собеседник вышел. Ищем нового…', false); find(); }
      if (m.t === 'error') { $('err').textContent = m.msg; leave(); }
    };
    ws.onclose = () => { if ($('call').style.display === 'block') { setStatus('Связь с сервером потеряна', false); } };
  });
}

function leave() {
  sendWs({ t: 'stop' }); closePc(); show(false);
  if (local) { local.getTracks().forEach((t) => t.stop()); local = null; }
}

$('find').onclick = async () => {
  $('err').textContent = '';
  try {
    local = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) { $('err').textContent = 'Нужен доступ к микрофону. Разрешите его в настройках.'; return; }
  cfg = await (await fetch('/config')).json();
  if (!ws || ws.readyState !== 1) await connect();
  muted = false; $('mute').textContent = 'Выключить микрофон';
  show(true); find();
};
$('next').onclick = find;
$('stop').onclick = leave;
$('report').onclick = () => { sendWs({ t: 'report' }); setStatus('Жалоба отправлена. Ищем нового…', false); closePc(); find(); };
$('mute').onclick = () => {
  muted = !muted; local.getAudioTracks().forEach((t) => (t.enabled = !muted));
  $('mute').textContent = muted ? 'Включить микрофон' : 'Выключить микрофон';
};
</script>
</body>
</html>
